<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>{{APP_NAME}} - User Manual</title>
<link rel="stylesheet" href="print.css">
<style>
body { font-family: Georgia, serif; color: #1a1a1a; max-width: 820px; margin: 0 auto; padding: 32px; }
figure { break-inside: avoid; margin: 20px 0; }
figure.phone .shot { max-width: 300px; margin: 0 auto; border: 10px solid #111; border-radius: 28px; overflow: hidden; }
figure.desk .shot { border: 1px solid #ccc; border-radius: 6px; overflow: hidden; }
figure .imgwrap { position: relative; }
figure .shot img { display: block; width: 100%; }
.badge { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #c00; color: #fff; font: bold 14px/26px sans-serif; text-align: center; transform: translate(-50%, -50%); }
.callout { margin: 6px 0; }
.badge-inline { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: #c00; color: #fff; font: bold 12px/22px sans-serif; text-align: center; }
.tips { background: #fff8e1; border-left: 4px solid #f9a825; padding: 8px 12px; margin: 12px 0; }
.chapter { break-before: page; }
.chapter:first-of-type { break-before: avoid; }
@media print { body { padding: 0; } }
</style>
</head>
<body>
<header class="cover"><h1>{{APP_NAME}}</h1><p>User Manual</p></header>
<nav class="toc"><h2>{{TOC_TITLE}}</h2><ul>{{TOC}}</ul></nav>
<main>{{BODY}}</main>
</body>
</html>
